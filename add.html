<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>添加笔记 · 书页之间</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">书页之间</a>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="books.html">书籍列表</a>
        <a href="add.html" class="active">添加笔记</a>
        <a href="about.html">关于我</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container page">
      <div class="form-card">
        <h1 class="section-title">分享你的读书笔记</h1>
        <p class="form-desc">把你读过的书和感受留在这里，所有人打开网站都能看到。</p>

        <form id="add-form" class="add-form">
          <div class="form-row">
            <div class="form-group">
              <label for="f-title">书名 <span class="required">*</span></label>
              <input type="text" id="f-title" placeholder="例如：《活着》" required>
            </div>

            <div class="form-group">
              <label for="f-cover">上传封面图 <span class="hint">（可选）</span></label>
              <input type="file" id="f-cover" accept="image/*">
            </div>

            <div class="form-group">
              <label for="f-author">作者</label>
              <input type="text" id="f-author" placeholder="例如：余华">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="f-submitter">你的名字</label>
              <input type="text" id="f-submitter" placeholder="可选，留空则显示匿名">
            </div>
            <div class="form-group">
              <label for="f-date">阅读时间</label>
              <input type="date" id="f-date">
            </div>
          </div>

          <div class="form-group">
            <label for="f-intro">一句话简介</label>
            <input type="text" id="f-intro" placeholder="用一句话概括这本书">
          </div>

          <div class="form-group">
            <label for="f-notes">读后感 <span class="hint">（每段一行）</span></label>
            <textarea id="f-notes" rows="5" placeholder="写下你的真实感受，可以分多段…"></textarea>
          </div>

          <div class="form-group">
            <label for="f-quotes">摘抄笔记 <span class="hint">（每句一行）</span></label>
            <textarea id="f-quotes" rows="4" placeholder="摘录你喜欢的句子…"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">提交笔记</button>
            <a href="books.html" class="btn-secondary">取消</a>
          </div>
        </form>

        <p id="msg" class="form-msg"></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 书页之间 · 个人读书笔记展示站</p>
  </footer>

  <script src="js/data.js"></script>
  <script>
    document.getElementById('add-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = '提交中…';
      
            // 上传封面图
      let coverUrl = null;
      const coverFile = document.getElementById('f-cover').files[0];
      if (coverFile) {
        const fileName = Date.now() + '_' + coverFile.name.replace(/[^\w.-]/g, '_');
        const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/covers/${fileName}`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': coverFile.type
          },
          body: coverFile
        });
        if (!uploadRes.ok) {
          alert('封面上传失败，请稍后再试。');
          btn.disabled = false;
          btn.textContent = '提交笔记';
          return;
        }
        coverUrl = `${SUPABASE_URL}/storage/v1/object/public/covers/${fileName}`;
      }

      const body = {
        title: document.getElementById('f-title').value,
        author: document.getElementById('f-author').value,
        read_date: document.getElementById('f-date').value || null,
        intro: document.getElementById('f-intro').value,
        notes: document.getElementById('f-notes').value.split('\n').filter(Boolean),
        quotes: document.getElementById('f-quotes').value.split('\n').filter(Boolean),
        cover_color: '#f3e5d8',
        cover_text: document.getElementById('f-title').value.replace(/[《》]/g, '').slice(0, 3),
        submitter: document.getElementById('f-submitter').value || '匿名',
        cover_image: coverUrl
      };

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/books`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(body)
        });

        if (res.ok) {
          document.getElementById('msg').textContent = '提交成功！即将跳转…';
          document.getElementById('msg').className = 'form-msg success';
          setTimeout(() => location.href = 'books.html', 1200);
        } else {
          const err = await res.text();
          console.error('提交失败原因：', err);
          document.getElementById('msg').textContent = '提交失败，请按 F12 看控制台报错。';
          document.getElementById('msg').className = 'form-msg error';
          btn.disabled = false;
          btn.textContent = '提交笔记';
        }
      } catch (err) {
        console.error(err);
        document.getElementById('msg').textContent = '网络错误，请稍后再试。';
        document.getElementById('msg').className = 'form-msg error';
        btn.disabled = false;
        btn.textContent = '提交笔记';
      }
    });
  </script>
</body>
</html>
